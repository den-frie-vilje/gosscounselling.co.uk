# Push to `main` builds, pushes and Sigstore-signs the production image, with
# the editor stripped out of it.
#
# Content-only pushes are the CMS saving; they skip the signature check and
# the reviewer gate, because an editor cannot sign a commit. Anything that
# touches code needs both.

name: Deploy to production

# MANUAL ONLY since 22 Aug 2026. Production moved to John's own web host —
# deploy-static-host.yml owns the push-to-main deploy now. This container
# path is kept runnable by hand in case the NAS ever needs to serve as a
# fallback origin, and so the image recipe does not rot unnoticed.
on:
  workflow_dispatch:

jobs:
  deploy:
    uses: den-frie-vilje/nas-sites/.github/workflows/build-and-sign.yml@v1
    with:
      environment: production
      dockerfile: deploy/Dockerfile
      image-name: ghcr.io/den-frie-vilje/gosscounselling
      platforms: linux/amd64
      build-args: |
        VITE_MODE=production
        STRIP_EDITOR=true
        PUBLIC_GIT_SHA=${{ github.sha }}
        PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp }}
        PUBLIC_GITHUB_REPO=${{ github.repository }}
      verify-url: https://gosscounselling.co.uk/
