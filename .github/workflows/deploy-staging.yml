# Push to `staging` builds, pushes and Sigstore-signs the site image.
# CI never touches the NAS: the pull-only agent verifies the signature and
# deploys on its own schedule.

name: Deploy to staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    uses: den-frie-vilje/nas-sites/.github/workflows/build-and-sign.yml@main
    with:
      environment: staging
      dockerfile: deploy/Dockerfile
      image-name: ghcr.io/den-frie-vilje/gosscounselling
      platforms: linux/amd64
      build-args: |
        VITE_MODE=staging
        PUBLIC_GIT_SHA=${{ github.sha }}
        PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp }}
        PUBLIC_GITHUB_REPO=${{ github.repository }}
      # Polls the live page for this commit's sha, which is only true once the
      # agent has actually pulled and started the new image. The page names its
      # own commit in <meta name="git-sha">; pull-only means CI never sees the
      # rollout, so the page has to be the witness.
      verify-url: https://gosscounselling-co-uk.stage.denfrievilje.dk/
