# THE PRODUCTION DEPLOY: build the site and copy it to John's web host.
#
# A push to `main` publishes. That is the whole model now — John's editor
# writes to `main` (see src/routes/admin/config.yml/+server.ts), this workflow
# builds what he saved and copies it to Fasthosts, and a couple of minutes
# later his change is live. The NAS container stack stays on `staging` for our
# own design work; production has no container, no proxy and no runtime — a
# directory of files behind the host's Apache, with static/.htaccess carrying
# what deploy/nginx.conf used to do.
#
# The editor survives the move without any service: production signs in with a
# GitHub personal access token (the manual's chapter 1–2 walk John through
# it), so nothing here needs an OAuth broker. /admin ships in this build on
# purpose — STRIP_EDITOR belongs to the container image, not to this host.
#
# `pnpm check:publish`, NOT `pnpm check`. This run IS John's publish: the
# gates that judge his content report into the log and never block, because a
# save that silently fails to appear is worse than a long nav label. Only the
# gates that judge OUR code (svelte-check, contrast, copy, deploy wiring) and
# the two disclosure gates after the build can stop this workflow. See
# scripts/run-gates.ts for the whole rule.
#
# Three transports, because shared hosts offer what they offer:
#   rsync  over SSH  — preferred where the host runs rsync and takes a key
#   sftp   via lftp  — for password-only SSH hosts (Fasthosts' documented
#                      shape: port 22 or 1022 on clustered accounts)
#   ftps   via lftp  — explicit TLS, the last resort; never plain FTP
# Pick once with the STATIC_HOST_TRANSPORT repository variable; a manual run
# can override it. STATIC_HOST_PORT covers Fasthosts' clustered-account 1022.

name: Deploy to the static host

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which build mode to publish'
        type: choice
        options: [production, staging]
        default: production
      transport:
        description: 'Override the STATIC_HOST_TRANSPORT variable for this run'
        type: choice
        options: ['', rsync, sftp, ftps]
        default: ''
      delete:
        description: 'Remove files on the host that are no longer in the build'
        type: boolean
        default: true

concurrency:
  group: static-host-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  # A push is always production. Manual runs may choose.
  DEPLOY_ENV: ${{ inputs.environment || 'production' }}
  # Input beats variable beats the safest default.
  TRANSPORT: ${{ inputs.transport || vars.STATIC_HOST_TRANSPORT || 'rsync' }}
  # A push deletes: a post John unpublishes must actually leave the host, or
  # its page outlives his decision. Manual runs may keep files for a rehearsal.
  DO_DELETE: ${{ github.event_name == 'push' && 'true' || inputs.delete }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: static-host-${{ inputs.environment || 'production' }}
    steps:
      - name: Refuse to run half-configured
        env:
          HOST: ${{ secrets.STATIC_HOST }}
          USER_NAME: ${{ secrets.STATIC_HOST_USER }}
          REMOTE_PATH: ${{ secrets.STATIC_HOST_PATH }}
          SSH_KEY: ${{ secrets.STATIC_HOST_SSH_KEY }}
          PASSWORD: ${{ secrets.STATIC_HOST_PASSWORD }}
        run: |
          missing=()
          [ -n "$HOST" ]        || missing+=(STATIC_HOST)
          [ -n "$USER_NAME" ]   || missing+=(STATIC_HOST_USER)
          [ -n "$REMOTE_PATH" ] || missing+=(STATIC_HOST_PATH)
          case "$TRANSPORT" in
            rsync) [ -n "$SSH_KEY" ]  || missing+=(STATIC_HOST_SSH_KEY) ;;
            sftp|ftps) [ -n "$PASSWORD" ] || missing+=(STATIC_HOST_PASSWORD) ;;
            *) echo "Unknown transport '$TRANSPORT'"; exit 1 ;;
          esac
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Not configured yet — missing secrets: ${missing[*]}"
            echo "Set them on the 'static-host-$DEPLOY_ENV' environment."
            echo "(Until they exist, every push to main stops here, loudly, on purpose.)"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install pkgx
        run: curl -Ssf https://pkgx.sh | sh

      # `pkgx dev` is what reads pkgx.yml; ad-hoc `pkgx <cmd>` defaults to
      # "latest" and will happily hand this build a major Node it has never
      # been tested on.
      - name: Build
        env:
          PUBLIC_GIT_SHA: ${{ github.sha }}
          PUBLIC_BUILD_TIME: ${{ github.event.repository.pushed_at }}
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: |
          eval "$(pkgx dev --shellcode)" && dev on
          pnpm install --frozen-lockfile
          pnpm check:publish
          pnpm build --mode "$DEPLOY_ENV"
          # The disclosure gates read what the build PRODUCED: no draft post's
          # words and no dev-only mock content in the output. These block on
          # every path, John's included — shipping a draft he has not
          # published is worse than not shipping.
          pnpm check:build

      # A build that produced nothing must not be allowed to delete a live
      # site. Cheap, and the one failure this workflow could not undo.
      - name: Refuse to publish an empty build
        run: |
          test -f build/index.html || { echo "build/index.html is missing — refusing to publish."; exit 1; }
          test -f build/.htaccess  || { echo "build/.htaccess is missing — the host would lose its 404 and caching. Refusing."; exit 1; }
          count=$(find build -type f | wc -l)
          echo "build/ holds $count files."
          [ "$count" -ge 10 ] || { echo "Only $count files — that is not a built site. Refusing."; exit 1; }

      - name: Publish over rsync
        if: ${{ env.TRANSPORT == 'rsync' }}
        env:
          SSH_KEY: ${{ secrets.STATIC_HOST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STATIC_HOST_KNOWN_HOSTS }}
          HOST: ${{ secrets.STATIC_HOST }}
          USER_NAME: ${{ secrets.STATIC_HOST_USER }}
          REMOTE_PATH: ${{ secrets.STATIC_HOST_PATH }}
          PORT: ${{ vars.STATIC_HOST_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust on first use, recorded in the log so the fingerprint can be
            # checked afterwards and pinned in STATIC_HOST_KNOWN_HOSTS.
            ssh-keyscan -p "$PORT" -H "$HOST" | tee ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          # Assets first and HTML last, so a visitor mid-deploy never gets a
          # page referencing a hashed bundle that has not arrived. The two
          # passes are why this is not one rsync.
          RSH="ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes"
          rsync -rlptDvz --checksum -e "$RSH" \
            --exclude='*.html' \
            build/ "$USER_NAME@$HOST:$REMOTE_PATH/"
          rsync -rlptDvz --checksum -e "$RSH" \
            $([ "$DO_DELETE" = "true" ] && echo --delete) \
            build/ "$USER_NAME@$HOST:$REMOTE_PATH/"

      - name: Publish over SFTP
        if: ${{ env.TRANSPORT == 'sftp' }}
        env:
          HOST: ${{ secrets.STATIC_HOST }}
          USER_NAME: ${{ secrets.STATIC_HOST_USER }}
          PASSWORD: ${{ secrets.STATIC_HOST_PASSWORD }}
          REMOTE_PATH: ${{ secrets.STATIC_HOST_PATH }}
          KNOWN_HOSTS: ${{ secrets.STATIC_HOST_KNOWN_HOSTS }}
          PORT: ${{ vars.STATIC_HOST_PORT || '22' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
            CONFIRM=no
          else
            # First run: accept and RECORD the host key, so it can be pinned.
            ssh-keyscan -p "$PORT" "$HOST" | tee -a ~/.ssh/known_hosts
            CONFIRM=yes
          fi
          # Same shape as rsync: assets first, HTML last, delete only on the
          # full second pass.
          lftp -c "
            set sftp:auto-confirm $CONFIRM;
            set net:max-retries 2;
            open -p $PORT -u '$USER_NAME','$PASSWORD' sftp://$HOST;
            mirror --reverse --parallel=4 --verbose --exclude-glob '*.html' build/ '$REMOTE_PATH/';
            mirror --reverse --parallel=4 --verbose $([ "$DO_DELETE" = "true" ] && echo --delete) build/ '$REMOTE_PATH/';
          "

      - name: Publish over FTPS
        if: ${{ env.TRANSPORT == 'ftps' }}
        env:
          HOST: ${{ secrets.STATIC_HOST }}
          USER_NAME: ${{ secrets.STATIC_HOST_USER }}
          PASSWORD: ${{ secrets.STATIC_HOST_PASSWORD }}
          REMOTE_PATH: ${{ secrets.STATIC_HOST_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Explicit TLS, and the certificate is verified. A static host that
          # cannot offer FTPS should not be given a password.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            open -u '$USER_NAME','$PASSWORD' '$HOST';
            mirror --reverse --parallel=4 --verbose --exclude-glob '*.html' build/ '$REMOTE_PATH/';
            mirror --reverse --parallel=4 --verbose $([ "$DO_DELETE" = "true" ] && echo --delete) build/ '$REMOTE_PATH/';
          "

      # The same witness the pull-only CD uses: ask the live page which commit
      # it is. Nothing else proves the copy landed.
      - name: Verify the live page names this commit
        env:
          SITE_URL: ${{ vars.STATIC_HOST_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "STATIC_HOST_SITE_URL is not set — cannot verify. Set it to skip nothing."
            exit 1
          fi
          for attempt in $(seq 1 10); do
            body=$(curl -fsS --max-time 20 "$SITE_URL" || true)
            if printf '%s' "$body" | grep -q "${{ github.sha }}"; then
              echo "Live at $SITE_URL — ${{ github.sha }}"
              exit 0
            fi
            echo "attempt $attempt: not live yet"
            sleep 15
          done
          echo "The page at $SITE_URL never named ${{ github.sha }}. The copy may not have landed,"
          echo "or the host is serving a cached copy."
          exit 1
