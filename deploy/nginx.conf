server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without these, nginx builds redirects from its own host:port and leaks
    # 127.0.0.1:8080 to the browser once it is behind Caddy and DSM.
    port_in_redirect off;
    absolute_redirect off;

    # Hashed build assets never change under their own name.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg|woff2?|eot|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML is cheap and changes on every deploy; revalidate it.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Every route prerenders to `<path>/index.html`, so `$uri/` alone would
    # serve the whole site. The other two arms are belt and braces, and
    # /200.html catches the routes that opt out of prerendering.
    #
    # Nothing here may become load-bearing: the same build/ is handed to a
    # third-party static host by the copy-to-host workflow, where none of this
    # exists. If a URL only works because of a rule in this file, it is broken
    # on the other host.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /200.html;
    }
}
