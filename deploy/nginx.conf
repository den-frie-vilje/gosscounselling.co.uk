server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Without this, nginx builds redirects from its own host:port and leaks
    # 127.0.0.1:8080 to the browser once it is behind Caddy and DSM.
    absolute_redirect off;
    index index.html;

    # These are prototypes under active revision — never let anything cache.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The detail-page links in the prototypes point at routes that do not exist
    # yet (/counselling/individual and friends). Send them back to the chooser
    # rather than showing John an nginx 404.
    error_page 404 = @chooser;
    location @chooser { return 302 /; }
}
