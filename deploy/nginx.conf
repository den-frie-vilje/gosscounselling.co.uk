server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without these, nginx builds redirects from its own host:port and leaks
    # 127.0.0.1:8080 to the browser once it is behind Caddy and DSM.
    port_in_redirect off;
    absolute_redirect off;

    # Hashed build assets never change under their own name.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg|woff2?|eot|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML is cheap and changes on every deploy; revalidate it.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Every route prerenders to `<path>/index.html`, so `$uri/` alone would
    # serve the whole site. The other two arms are belt and braces.
    #
    # The last arm used to be `/200.html`, which answered every typo and every
    # stale inbound link with HTTP 200 and an empty page. A crawler reading
    # that has been told the page exists and is blank, which is worse than
    # being told it is gone. `=404` hands off to `error_page` below instead.
    #
    # Nothing here may become load-bearing: the same build/ is handed to a
    # third-party static host by the copy-to-host workflow, where none of this
    # exists. If a URL only works because of a rule in this file, it is broken
    # on the other host — which is why the file it serves is `404.html`, the
    # name those hosts already serve with a 404 status unprompted.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
