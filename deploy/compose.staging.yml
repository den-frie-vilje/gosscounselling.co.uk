# Staging stack — gosscounselling-co-uk.stage.denfrievilje.dk
# Lives at /volume1/docker/gosscounselling.co.uk/staging on the NAS.
#
# Reconciled by the nas-sites pull-only agent within ~5 minutes of a push to
# `staging`. Two containers only: the front door and the static prototypes.
# No CMS, no OAuth proxy — there is no app yet.

name: gosscounselling-staging

networks:
  nas-deploy:
    external: true
  internal:

services:
  caddy:
    image: caddy:2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    # No published host port. The project has its own internal network, and the
    # front door reaches this container over the shared `nas-deploy` network by
    # the alias below — so there is no per-site loopback port to allocate or
    # collide. The alias is explicit because the service is called `caddy` in
    # every site's compose; only the alias is unique across the shared network.
    networks:
      nas-deploy:
        aliases: [gosscounselling-staging]
      internal:
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      site:
        condition: service_started

  site:
    image: ghcr.io/den-frie-vilje/gosscounselling:staging-latest
    restart: unless-stopped
    networks: [internal]
    pull_policy: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
