# Sveltia CMS configuration — single locale (English).
#
# Editing happens on STAGING (gosscounselling-co-uk.stage.denfrievilje.dk/admin)
# against the GitHub backend through the OAuth proxy (Caddy `/auth/*` →
# sveltia-auth). Prose fields use the `markdown` widget so copy stays flowing
# prose rather than arrays of bullets, and the toolbar is cut back to what the
# copy actually needs: a full toolbar invites structure the design has no place
# for.
#
# Four collections, in the order John reaches for them rather than the order
# the files were written:
#   • Home     — the home page, which is the whole site, one entry per SECTION
#                of the scroll and in the order the page puts them, so that
#                editing the fees is opening "Fees" rather than scrolling past
#                everything else he has ever written
#   • Services — one entry per thing he offers, each with a page of its own if
#                he writes one
#   • General  — the things reused across the page, commonest first: his
#                contact details, then testimonials, his social profiles, the
#                bodies he belongs to, his name, and last what search engines
#                and share cards are told, which he will touch about once
#   • Blog     — the posts, which may be empty and usually are
#
# THREE RULES FOR ANYONE ADDING A FIELD HERE.
#
# 1. External links are John's to write and stay ordinary string fields: a
#    register listing, a body he trained with, a link out of a post. An
#    address that points at THIS site is never a field. Page addresses are
#    derived in code from the route tree, so there is no URL for him to type
#    and nothing for him to keep in step when a route changes.
#
# 2. Nothing is asked for twice. Not as a second field, and not spelled out
#    inside a sentence either: his number, his email address and the WhatsApp
#    link are written as {phone}, {email}, {tel}, {mailto} and {whatsapp}
#    wherever a piece of copy needs them, and filled in at build time from
#    Contact details. $lib/copy-tokens has the list; scripts/check-contact.ts
#    refuses an unknown one, and refuses the number written out longhand.
#
# 3. A field nothing renders must not exist. A page-level `navLabel` reading
#    "Home", `schema.serviceType` and the contact block's own `heading` all sat
#    here for months with nothing reading them; an editor that accepts a change
#    and does nothing with it teaches him not to trust the ones that work.
#    (The per-section `navLabel` fields below are a different thing and are
#    read: they are the words in the menu bar. scripts/check-nav.ts gates them.)

backend:
  name: github
  repo: den-frie-vilje/gosscounselling.co.uk
  branch: staging
  base_url: https://gosscounselling-co-uk.stage.denfrievilje.dk/auth
  site_domain: gosscounselling-co-uk.stage.denfrievilje.dk

# Staging writes go straight to the staging branch; publishing to production
# is a separate, deliberate step.
publish_mode: simple

media_folder: static/img
public_folder: /img

collections:
  # THE HOME PAGE, ONE ENTRY PER SECTION.
  #
  # It was a single entry called "Home — the whole scroll", holding every
  # section of the page nested inside it, and it had grown to a form John had
  # to scroll through five screens of to change a fee. So each section of the
  # scroll is now an editor page of its own.
  #
  # A `files:` collection, not a folder, and that is the point rather than a
  # detail. These sections have fixed identities: the page renders exactly
  # these eight and no others, so there is no New button and nothing to
  # delete — a "section" John could add would be a section nothing renders,
  # which is rule 3 above. It is also the only collection shape whose ORDER
  # is authored, and the order here is the order the sections appear on the
  # page: `scripts/check-nav.ts` reads that order out of the markup, and this
  # list follows it — top, what happens, how I can help, about, fees,
  # qualifications, questions, get in touch.
  - name: home
    label: Home
    # No side preview pane: it renders a generic field dump rather than the
    # real site. Changes are reviewed on staging instead.
    editor: { preview: false }
    description: >
      Your page, top to bottom, one section at a time and in the order a visitor scrolls
      through them. Nothing here can break the page: every section is always there, and every
      field is words rather than layout.
    files:
      - name: hero
        label: Top of the page
        file: src/content/home/hero.json
        hint: 'The dark band at the very top, and the first thing anybody reads.'
        fields:
          - {
              name: eyebrow,
              label: Small label above the headline,
              widget: string,
              hint: 'Also printed under your name on the card people see when they share the site, so it is written here once and used in both places.'
            }
          - { name: title, label: Headline, widget: string }
          - { name: lead, label: Opening paragraph, widget: text }
          - {
              name: aside,
              label: The quieter line,
              widget: text,
              hint: 'Hung off a rule under the opening paragraph. Currently your own sentence from the old site.'
            }
          - {
              name: reassure,
              label: Line under the buttons,
              widget: markdown,
              buttons: [bold, italic, link],
              editor_components: [],
              modes: [rich_text],
              hint: 'The WhatsApp link here points at {whatsapp}, which is filled in from your number under General → Contact details. Leave it as it is and it can never point at the wrong phone.'
            }
          - {
              name: ctaPrimary,
              label: First button,
              widget: string,
              hint: 'Write {phone} where the number should appear and it is filled in from Contact details. Typing the number out instead is how the button ends up reading one number and dialling another.'
            }
          - { name: ctaSecondary, label: Second button, widget: string }
          # The upload that drives the whole portrait pipeline. A photograph
          # dropped here is keyed, cut out and composited by the build; see
          # scripts/keyer.ts, which measures the backdrop rather than
          # assuming one and REFUSES a photograph it cannot key cleanly
          # rather than publishing a bad cut-out.
          #
          # Its own folder, not `static/img`, because the pipeline watches
          # that folder and everything else in `static/img` is something it
          # produced. Optional, so leaving it empty keeps the portrait that
          # is already there.
          - {
              name: portrait,
              label: Your photograph,
              widget: image,
              required: false,
              media_folder: '/static/img/portrait',
              public_folder: '/img/portrait',
              hint: 'This is the photograph the site cuts you out of. Replace it whenever you like — the site removes the background itself, places you on the blue circle at the top of the page, and puts you on the picture people see when the site is shared. Nothing is done to your face or your colours.

                    What works: you against a plain wall or backdrop in one flat colour, lit evenly so there are no strong shadows on it behind you, and a colour nothing you are wearing shares — a green or blue wall is ideal, a white one is the hardest. Head and shoulders, looking at the camera, with a little room above your head. What does not work: a busy room behind you, a patchy or shadowed wall, or a jumper the same colour as the wall. If it cannot be cut out cleanly the site says so and keeps the photograph you already have rather than publishing a bad cut-out.'
            }
          - {
              name: portraitAlt,
              label: Photo description,
              widget: string,
              hint: 'Read out to anyone who cannot see the photo. A few words are plenty.'
            }

      - name: steps
        label: What happens when you get in touch
        file: src/content/home/steps.json
        hint: 'The three steps under the top of the page, before anything else is asked of anyone.'
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Line under the heading, widget: text }
          - name: items
            label: Steps
            widget: list
            summary: '{{fields.title}}'
            hint: 'Numbered on the page in the order they are listed here, so dragging one up renumbers them for you.'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }

      - name: services
        label: How I can help
        file: src/content/home/services.json
        hint: 'The heading and the line under it. The things you offer are their own entries, under Services.'
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'What this section is called in the menu at the top. Keep it short: the menu has room for about 50 characters across all of it, and if it stops fitting the site falls back to the ☰ button. Leave it empty to use "How I can help".'
            }
          - { name: intro, label: Line under the heading, widget: text }

      - name: about
        label: About me
        file: src/content/home/about.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'What this section is called in the menu at the top. Keep it short: the menu has room for about 50 characters across all of it, and if it stops fitting the site falls back to the ☰ button. Leave it empty to use "About me".'
            }
          - {
              name: body,
              label: Body,
              widget: markdown,
              buttons: [bold, italic, link, bulleted-list],
              editor_components: [],
              modes: [rich_text]
            }
          - {
              name: photoAlt,
              label: Photo description,
              widget: string,
              hint: 'Read out to anyone who cannot see the photo.'
            }

      - name: fees
        label: Fees
        file: src/content/home/fees.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'What this section is called in the menu at the top. Keep it short: the menu has room for about 50 characters across all of it, and if it stops fitting the site falls back to the ☰ button. Leave it empty to use "Fees".'
            }
          - { name: intro, label: Line under the heading, widget: text }
          - name: rows
            label: Fee groups
            widget: list
            summary: '{{fields.title}}'
            hint: >
              These are also where search engines get the price range they show for the
              practice: it is worked out from the lowest and highest number written below,
              so it follows your fees rather than having to be updated separately.
            fields:
              - { name: title, label: Group, widget: string }
              - name: lines
                label: Lines
                widget: list
                summary: '{{fields.label}} — {{fields.value}}'
                fields:
                  - {
                      name: label,
                      label: What it is,
                      widget: string,
                      hint: 'e.g. In person, 50 minutes'
                    }
                  - { name: value, label: Fee, widget: string, hint: 'e.g. £70–90' }
          - name: note
            label: Low-income note
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - {
                  name: body,
                  label: Body,
                  widget: markdown,
                  buttons: [bold, italic, link],
                  editor_components: [],
                  modes: [rich_text],
                  hint: 'The "Get in touch" link here points at {mailto}, which is filled in from your address under General → Contact details, so changing your email changes this link too.'
                }

      - name: quals
        label: Qualifications and membership
        file: src/content/home/quals.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - name: items
            label: Qualifications
            widget: list
            summary: '{{fields.title}} ({{fields.detail}})'
            hint: 'Listed on the page in the order they are in here.'
            fields:
              - { name: title, label: Qualification, widget: string }
              - {
                  name: detail,
                  label: Year,
                  widget: string,
                  hint: 'The year, or "studying" if it is in progress.'
                }
          - name: bodies
            label: Membership and registration
            widget: object
            hint: 'Just the heading. The bodies themselves are edited under General → Membership and registration, so their names are not typed twice.'
            fields:
              - { name: title, label: Heading, widget: string }

      - name: faq
        label: Questions people ask
        file: src/content/home/faq.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'What this section is called in the menu at the top. Keep it short: the menu has room for about 50 characters across all of it, and if it stops fitting the site falls back to the ☰ button. Leave it empty to use "Questions".'
            }
          - name: items
            label: Questions
            widget: list
            summary: '{{fields.q}}'
            hint: 'These also feed the FAQPage structured data that search engines read. Google no longer shows FAQ answers directly in its results, so this is for machines rather than for a rich result.'
            fields:
              - { name: q, label: Question, widget: string }
              - {
                  name: a,
                  label: Answer,
                  widget: markdown,
                  buttons: [bold, italic, link, bulleted-list],
                  editor_components: [],
                  modes: [rich_text]
                }

      - name: contact
        label: Get in touch
        file: src/content/home/contact.json
        hint: 'The last band on the page: the heading and the line under it. The phone number, email and WhatsApp link live under General → Contact details. This heading is also the one over the contact block in the phone menu, so it is written here and nowhere else.'
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'What this section is called in the menu at the top. Keep it short: the menu has room for about 50 characters across all of it, and if it stops fitting the site falls back to the ☰ button. Leave it empty to use "Get in touch".'
            }
          - { name: intro, label: Line under the heading, widget: text }

  - name: services
    label: Services
    label_singular: Service
    folder: src/content/services
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [order, title]
    editor: { preview: false }
    description: >
      One entry per thing you offer. They appear on the front page under "How I can help", in the
      order set below, and each can have a page of its own — fill in "The longer version" and the
      page appears with a link to it from that section; leave it empty and there is no page and no
      link. The web address is worked out from the title, so there is nothing to type and nothing
      to keep in step.
    fields:
      - {
          name: order,
          label: Order on the page,
          widget: number,
          value_type: int,
          default: 100,
          hint: 'Lower numbers come first. They are numbered in tens — 10, 20, 30 — so a new one can be slid between two others without renumbering everything.'
        }
      # Not an editable field, on purpose: this is what the page's
      # address is built from. It is declared so the editor keeps
      # it on save rather than deleting it, which is exactly the
      # failure scripts/check-cms.ts exists to catch.
      - { name: slug, widget: hidden }
      - { name: title, label: Title, widget: string }
      - { name: who, label: Who it is for, widget: string }
      - {
          name: body,
          label: Body,
          widget: markdown,
          buttons: [bold, italic, link],
          editor_components: [],
          modes: [rich_text],
          hint: 'What you write here appears on the front page; anything in the longer section below is added underneath it on the service’s own page. So this is written once and you never have to keep two versions of it saying the same thing.'
        }
      - name: detail
        label: The longer version
        widget: object
        required: false
        collapsed: true
        hint: 'Leave this empty and the service has no page of its own. Write something here and the page appears at the next deploy, opening with the body above and continuing with this.'
        fields:
          - {
              name: body,
              label: Body,
              widget: markdown,
              # Headings start at two. One is the page's own title,
              # which the site writes from the service name — a
              # second first-level heading inside the body would
              # give the page two titles and tell a search engine
              # the wrong one is the subject.
              buttons:
                [
                  bold,
                  italic,
                  link,
                  heading-two,
                  heading-three,
                  bulleted-list,
                  numbered-list,
                  quote
                ],
              editor_components: [],
              modes: [rich_text],
              required: false,
              hint: 'The long, specific page for one thing people search for. Use “Heading 2” for the main parts and “Heading 3” under them — the page already has its own title, so there is no Heading 1 to choose.'
            }
          - name: seo
            label: Search engine summary
            widget: object
            required: false
            collapsed: true
            hint: 'How this page looks in a Google result. You can leave the whole thing alone: left empty it uses this service’s own title and its opening lines, which is usually right. Fill it in when the search result should read differently from the page.'
            fields:
              - {
                  name: title,
                  label: Title in the search result,
                  widget: string,
                  required: false,
                  hint: 'Also what shows in the browser tab. Around 60 characters — Google cuts it off after that.'
                }
              - {
                  name: description,
                  label: Description in search results,
                  widget: text,
                  required: false,
                  hint: 'About 150 characters, written for the person reading the search result.'
                }

  - name: general
    label: General
    editor: { preview: false }
    files:
      - name: contact
        label: Contact details
        file: src/content/contact.json
        hint: >
          Your number and your address, in one place. They are shown in the contact section, in
          the phone menu and in the footer, they are behind every Call button, and they are what
          {phone}, {email}, {tel}, {mailto} and {whatsapp} stand for wherever those appear in
          your copy. Write them the way you would say them: the dialling link, the email link
          and the WhatsApp link are all worked out from them, so there is nothing here to keep
          in step, and changing the number here changes it everywhere at the next deploy.
        fields:
          - {
              name: phone,
              label: Phone,
              widget: string,
              hint: 'However you would write it — 07776 153 426. The dialling link and the WhatsApp link are made from this. If what you type cannot be dialled, the site refuses to publish rather than shipping a Call button that rings nobody.'
            }
          - {
              name: phoneNote,
              label: Note under the phone number,
              widget: string,
              hint: 'Keep this to what the visitor can do. Anything about how quickly you reply is a promise the page will keep making.'
            }
          - {
              name: whatsappNote,
              label: Note under WhatsApp,
              widget: string,
              hint: 'The WhatsApp row uses the same number as the phone row; there is nothing separate to enter.'
            }
          - { name: email, label: Email, widget: string }
          - { name: emailNote, label: Note under the email address, widget: string }
          - {
              name: location,
              label: Where you work,
              widget: string,
              hint: 'Shown beside a pin in the contact section and in the phone menu.'
            }
          - { name: locationNote, label: Note under where you work, widget: string }

      - name: testimonials
        label: Testimonials
        file: src/content/testimonials.json
        hint: >
          The section only appears once there is at least one testimonial; an empty list shows
          nothing at all, so it is safe to leave until you have one. Worth knowing before you
          start: neither the NCPS nor the COSRT code addresses testimonials directly, so the
          general duties apply, which are honest advertising, not exploiting the position of
          trust, and confidentiality. The BACP allows client testimonials on its own directory
          listings where you have the person's permission. If you would rather not quote current
          or recent clients, supervisees and colleagues are the safer source. Identifying detail
          is the risk even when a name is not used. There are no star ratings on this site,
          deliberately.
        fields:
          - {
              name: kicker,
              label: Small label above the quotes,
              widget: string,
              hint: 'There is no heading and no standing note: a quotation introduced by a sentence saying it is a quotation is weaker than the quotation.'
            }
          - name: items
            label: Testimonials
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: quote, label: Quote, widget: text }
              - {
                  name: name,
                  label: Who said it,
                  widget: string,
                  hint: 'Anonymised for client work, e.g. "Supervisee, 2025". A name only where the person is a colleague and has agreed to it.'
                }
              - {
                  name: detail,
                  label: Role or context,
                  widget: string,
                  required: false
                }

      - name: social
        label: Social profiles
        file: src/content/social.json
        hint: >
          Shown as logos in the footer, and told to search engines so they know these accounts are
          yours. Pick a platform and paste the address; the name fills itself in. Only add a
          profile that is actually yours — a wrong one here sends people to a stranger, and search
          engines are being told it is you. These are other people's addresses, so they are yours
          to write; pages on this site are never typed in here.
        fields:
          - {
              name: note,
              label: Note to yourself,
              widget: text,
              required: false,
              hint: 'Not shown anywhere on the site. It is here to record how each profile below was confirmed to be yours, which is worth having written down.'
            }
          - name: profiles
            label: Profiles
            widget: list
            summary: '{{fields.label}}'
            fields:
              # Kept in step with src/lib/generated/social-icons.ts by
              # scripts/check-social.ts: a platform offered here with no entry
              # there would put an icon in the footer that cannot be drawn.
              - {
                  name: platform,
                  label: Platform,
                  widget: select,
                  options:
                    [
                      { label: Facebook, value: facebook },
                      { label: Instagram, value: instagram },
                      { label: LinkedIn, value: linkedin },
                      { label: X, value: x },
                      { label: Threads, value: threads },
                      { label: Bluesky, value: bluesky },
                      { label: YouTube, value: youtube },
                      { label: TikTok, value: tiktok },
                      { label: Substack, value: substack },
                      { label: Spotify, value: spotify },
                      { label: Mastodon, value: mastodon },
                      { label: Pinterest, value: pinterest }
                    ],
                  hint: 'Pick the one the address below belongs to. It decides which logo is drawn in the footer. If you start using something that is not on this list, it can be added.'
                }
              - {
                  name: label,
                  label: Name,
                  widget: string,
                  required: false,
                  hint: 'Leave it empty and it uses the platform’s own name, which is almost always what you want. It is what a screen reader says in place of the logo, so change it only if “Facebook” is not the right thing to hear.'
                }
              - {
                  name: url,
                  label: Address,
                  widget: string,
                  hint: 'The full address of your profile, pasted from the browser — for example https://www.facebook.com/gosscounselling.'
                }

      # The bodies, out of Site and standing on their own. They were a list
      # nested at the bottom of the Site entry, under a name, a tagline and
      # four fields of Schema.org — so adding a register meant opening the
      # entry John has least reason to open and scrolling past everything in
      # it. They are also the only thing in that entry with a logo to upload.
      - name: memberships
        label: Membership and registration
        file: src/content/memberships.json
        hint: >
          The bodies you belong to, and the ones that accredit or list you. Shown as a row
          each, logo beside name, in the qualifications section on the page, and told to
          search engines. The heading over them on the page is under Home → Qualifications
          and membership, so their names are not typed twice.
        fields:
          - name: items
            label: Bodies
            widget: list
            summary: '{{fields.abbr}}'
            hint: 'Listed on the page in the order they are in here.'
            fields:
              - { name: name, label: Full name, widget: string }
              - { name: abbr, label: Abbreviation, widget: string }
              - {
                  name: logo,
                  label: Logo,
                  widget: image,
                  media_folder: '/static/img/logos',
                  public_folder: '/img/logos',
                  hint: 'Shown on a white plate beside the name. All the plates are the same size, so the logo does not have to be.'
                }
              - {
                  name: isMembership,
                  label: You are a member of this body,
                  widget: boolean,
                  default: true,
                  hint: 'Off for a body that accredits rather than admits, such as the Professional Standards Authority. Only the ones you belong to are declared as memberships to search engines.'
                }
              - {
                  name: note,
                  label: Note beside the name,
                  widget: string,
                  required: false,
                  hint: 'Your grade, e.g. Accredited Member — or, for a body you are not a member of, what its relationship to you is. Leave empty and just the name shows.'
                }
              - {
                  name: href,
                  label: Register listing,
                  widget: string,
                  required: false,
                  hint: 'Your public listing on their register. Leave empty and the name shows unlinked.'
                }

      - name: site
        label: Site
        file: src/content/site.json
        hint: >
          Your name, the line under it, and what search engines are told about you. These
          change about once. How the site LOOKS in a search result or when somebody shares it
          is next door, under Search engines and sharing; everything a visitor reads on the
          page itself is under Home.
        fields:
          - { name: name, label: Name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - {
              name: footerNote,
              label: Footer note,
              widget: string,
              hint: 'Use {year} for the year; it is filled in automatically, so the copyright line is never out of date.'
            }
          - name: schema
            label: What search engines are told
            widget: object
            hint: 'Read by machines, not shown anywhere on the page. Getting it wrong makes the site harder to find; it cannot break anything a visitor sees.'
            fields:
              - { name: jobTitle, label: Job title, widget: string }
              - {
                  name: bio,
                  label: A sentence or two about you,
                  widget: text,
                  hint: 'For search engines only. Your own About me section is under Home.'
                }
              - {
                  name: knowsAbout,
                  label: Topics you work with,
                  widget: list,
                  field: { name: topic, label: Topic, widget: string }
                }
              - {
                  name: areaServed,
                  label: Areas served,
                  widget: list,
                  field: { name: area, label: Area, widget: string }
                }

      # How the site LOOKS somewhere else: in a search result, and in the
      # picture that appears when somebody pastes the address into a chat.
      # The two were in different places — the sentence Google shows was at
      # the bottom of Site, the share card was at the bottom of the home
      # page — and they are one job, done once, so they are one entry.
      - name: search
        label: Search engines and sharing
        file: src/content/search.json
        hint: >
          How your site appears where it is not: the blue line and the sentence under it in a
          Google result, and the picture people see when the address is shared in a chat. None
          of this shows on the page itself. You can leave it alone once it is written.
        fields:
          # Read straight from the file by scripts/gen-og.ts as the share
          # card's last fallback title, so a placeholder must never appear
          # here (check-contact.ts).
          - {
              name: title,
              label: Title in the search result,
              widget: string,
              hint: 'Also what shows in the browser tab. Around 60 characters — Google cuts it off after that.'
            }
          - {
              name: description,
              label: Description in search results,
              widget: text,
              hint: 'About 150 to 160 characters, written for the person reading the search result. Used under the title above, in link previews, and on the Blog page.'
            }
          - name: og
            label: Social-share card
            widget: object
            hint: 'The picture people see when your site is shared in a chat or on social media. It is redrawn on its own each time the site publishes. There is one thing to write here — the card also shows your name and the “Bletchley, Milton Keynes” line, and it takes those from where you already wrote them rather than asking twice.'
            fields:
              # The card is drawn by scripts/gen-og.ts, in plain node,
              # straight from the JSON — so it never sees the {phone}-style
              # placeholders the pages resolve. A token here would be painted
              # onto the image as literal braces, and check-contact.ts refuses
              # one in this field and in the two others that script reads.
              - {
                  name: title,
                  label: Headline on the card,
                  widget: string,
                  hint: 'Leave it empty and the card uses the headline from the top of your home page, which is usually what you want. Fill it in only when the card needs a shorter or different line.'
                }

  # A blog is a FOLDER collection: one file per post in `src/content/posts/`,
  # one entry per post in the sidebar, a New post button, a search across the
  # posts, and a save that writes the one post John edited rather than
  # rewriting every post he has ever published.
  #
  # It was a `files:` entry holding a list of sortable cards inside a single
  # `posts.json`, and that was the shape of the CHECK rather than the shape of
  # the content: scripts/check-cms.ts could only diff a `files:` entry against
  # a JSON file and reported every other collection shape as a fault, so the
  # content was bent to fit the gate. The gate has been taught folder
  # collections instead.
  #
  # JSON rather than frontmatter markdown, on purpose. Every other content
  # file here is JSON, the body is already a markdown STRING rendered by
  # `marked` through $lib/markdown, and a second content format would fork the
  # pipeline — a second parser, a second set of checks — for nothing gained.
  - name: blog
    label: Blog
    label_singular: Post
    editor: { preview: false }
    folder: src/content/posts
    create: true
    extension: json
    format: json
    # The filename, and so the post's address. Sveltia settles it when the post
    # is created and leaves it alone afterwards, so retitling a post that is
    # already out in the world cannot break a link somebody has shared.
    slug: '{{title}}'
    summary: '{{title}} — {{status}}'
    sortable_fields: [publishAt, title]
    description: >
      There is no blog on the site until there is a post on it: with nothing published here,
      the Blog link, the blog page and the section on the front page are all absent, and the
      site simply does not have one. The first published post brings all three into being.
    fields:
      # Not an editable field, on purpose: this is what the post's address is
      # built from. Optional because a post made in the editor arrives without
      # one, and the address is then made from the title — which is also what
      # the filename is made from, so the two agree without either being typed.
      - { name: slug, widget: hidden, required: false }
      - { name: title, label: Title, widget: string }
      - {
          name: status,
          label: Status,
          widget: select,
          default: draft,
          options:
            [
              { label: 'Draft — only you can see it', value: draft },
              { label: 'Published', value: published }
            ],
          hint: 'A draft stays on your side of the fence: it is not built into the site at all, so there is no page for it and nothing to find. Set it to Published with a date in the past and it goes live at the next build, within minutes of saving.'
        }
      - {
          name: publishAt,
          label: Publish on,
          widget: datetime,
          default: '{{now}}',
          hint: 'A date and time in the future means the post appears on the site at that moment, and not before. You do not have to be there: it shows up on its own. A date in the past means it is live as soon as the site rebuilds.'
        }
      - {
          name: excerpt,
          label: Summary,
          widget: text,
          hint: 'Two or three lines. This is what is shown in the list of posts and on the front page, so it is written once and never has to be repeated.'
        }
      - {
          name: image,
          label: Picture,
          widget: image,
          required: false,
          media_folder: '/static/img/blog',
          public_folder: '/img/blog',
          hint: 'Optional. Shown on the Blog page and at the top of the post itself — not on the front page, where the posts are a short list and a row of pictures would take it over.'
        }
      - {
          name: imageAlt,
          label: Picture description,
          widget: string,
          required: false,
          hint: 'Read out to anyone who cannot see the picture. A few words. Leave it empty if the picture is decoration and says nothing the words do not.'
        }
      - {
          name: body,
          label: Body,
          widget: markdown,
          # Same rule as a service's own page: headings start at two, because
          # the post's title is the page's only first-level one.
          buttons:
            [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote],
          editor_components: [],
          modes: [rich_text],
          hint: 'Use “Heading 2” to break a long post into parts, and “Heading 3” under those. The post’s own title is the page’s Heading 1, so there is not one to choose here.'
        }
      - name: seo
        label: Search engine summary
        widget: object
        required: false
        collapsed: true
        hint: 'How this post looks in a Google result. You can leave the whole thing alone: left empty it uses the post’s own title and summary, which is usually right. Fill it in when the search result should read differently from the post.'
        fields:
          - {
              name: title,
              label: Title in the search result,
              widget: string,
              required: false,
              hint: 'Also what shows in the browser tab. Around 60 characters — Google cuts it off after that.'
            }
          - {
              name: description,
              label: Description in search results,
              widget: text,
              required: false,
              hint: 'About 150 characters, written for the person reading the search result.'
            }
