# Sveltia CMS configuration — single locale (English).
#
# Editing happens on STAGING (gosscounselling-co-uk.stage.denfrievilje.dk/admin)
# against the GitHub backend through the OAuth proxy (Caddy `/auth/*` →
# sveltia-auth). Prose fields use the `markdown` widget so copy stays flowing
# prose rather than arrays of bullets, and the toolbar is cut back to what the
# copy actually needs: a full toolbar invites structure the design has no place
# for.
#
# Four collections, in the order John reaches for them rather than the order
# the files were written:
#   • Home     — the home page, which is the whole site, one entry per SECTION
#                of the scroll and in the order the page puts them, so that
#                editing the fees is opening "Fees" rather than scrolling past
#                everything else he has ever written
#   • Services — one entry per thing he offers, each with a page of its own if
#                he writes one
#   • General  — the things reused across the page, commonest first: his
#                contact details, then testimonials, his social profiles, the
#                bodies he belongs to, his name, and last what search engines
#                and share cards are told, which he will touch about once
#   • Blog     — the posts, which may be empty and usually are
#
# THREE RULES FOR ANYONE ADDING A FIELD HERE.
#
# 1. External links are John's to write and stay ordinary string fields: a
#    register listing, a body he trained with, a link out of a post. An
#    address that points at THIS site is never a field. Page addresses are
#    derived in code from the route tree, so there is no URL for him to type
#    and nothing for him to keep in step when a route changes.
#
# 2. Nothing is asked for twice. Not as a second field, and not spelled out
#    inside a sentence either: his number, his email address and the WhatsApp
#    link are written as {phone}, {email}, {tel}, {mailto} and {whatsapp}
#    wherever a piece of copy needs them, and filled in at build time from
#    Contact details. $lib/copy-tokens has the list; scripts/check-contact.ts
#    refuses an unknown one, and refuses the number written out longhand.
#
# 3. A field nothing renders must not exist. A page-level `navLabel` reading
#    "Home", `schema.serviceType` and the contact block's own `heading` all sat
#    here for months with nothing reading them; an editor that accepts a change
#    and does nothing with it teaches him not to trust the ones that work.
#    (The per-section `navLabel` fields below are a different thing and are
#    read: they are the words in the menu bar. scripts/check-nav.ts gates them.)

backend:
  name: github
  repo: den-frie-vilje/gosscounselling.co.uk
  branch: staging
  base_url: https://gosscounselling-co-uk.stage.denfrievilje.dk/auth
  site_domain: gosscounselling-co-uk.stage.denfrievilje.dk

# Staging writes go straight to the staging branch; publishing to production
# is a separate, deliberate step.
publish_mode: simple

media_folder: static/img
public_folder: /img

collections:
  # THE HOME PAGE, ONE ENTRY PER SECTION.
  #
  # It was a single entry called "Home — the whole scroll", holding every
  # section of the page nested inside it, and it had grown to a form John had
  # to scroll through five screens of to change a fee. So each section of the
  # scroll is now an editor page of its own.
  #
  # A `files:` collection, not a folder, and that is the point rather than a
  # detail. These sections have fixed identities: the page renders exactly
  # these eight and no others, so there is no New button and nothing to
  # delete — a "section" John could add would be a section nothing renders,
  # which is rule 3 above. It is also the only collection shape whose ORDER
  # is authored, and the order here is the order the sections appear on the
  # page: `scripts/check-nav.ts` reads that order out of the markup, and this
  # list follows it — top, what happens, how I can help, about, fees,
  # qualifications, questions, get in touch.
  - name: home
    label: Home
    # No side preview pane: it renders a generic field dump rather than the
    # real site. Changes are reviewed on staging instead.
    editor: { preview: false }
    description: 'Your page, top to bottom, one section at a time.'
    files:
      - name: hero
        label: Hero
        file: src/content/home/hero.json
        hint: 'The dark band at the top of the page.'
        fields:
          - {
              name: eyebrow,
              label: Small label above the headline,
              widget: string,
              hint: 'Also appears on the share card.'
            }
          - { name: title, label: Headline, widget: string }
          - { name: lead, label: Opening paragraph, widget: text }
          - {
              name: aside,
              label: The quieter line,
              widget: text,
              hint: 'A short reassuring line under the opening paragraph.'
            }
          - {
              name: reassure,
              label: Line under the buttons,
              widget: markdown,
              buttons: [bold, italic, link],
              editor_components: [],
              modes: [rich_text],
              hint: 'Use {whatsapp} for your WhatsApp link.'
            }
          - {
              name: ctaPrimary,
              label: First button,
              widget: string,
              hint: 'Use {phone} for your number — never type it out.'
            }
          - {
              name: ctaSecondary,
              label: Second button — it opens an email,
              widget: string,
              hint: 'Always opens an email, whatever it says. Word it that way.'
            }
          # The upload that drives the whole portrait pipeline. A photograph
          # dropped here is keyed, cut out and composited by the build; see
          # scripts/keyer.ts, which measures the backdrop rather than
          # assuming one and REFUSES a photograph it cannot key cleanly
          # rather than publishing a bad cut-out.
          #
          # Its own folder, not `static/img`, because the pipeline watches
          # that folder and everything else in `static/img` is something it
          # produced. Optional, so leaving it empty keeps the portrait that
          # is already there.
          - {
              name: portrait,
              label: Your photograph,
              widget: image,
              required: false,
              media_folder: '/static/img/portrait',
              public_folder: '/img/portrait',
              hint: 'Cut out for you and placed on the blue circle. A plain, even background works best. Already cut out, with no background? It is used as it is.'
            }
          - {
              name: portraitAlt,
              label: Photo description,
              widget: string,
              hint: 'For anyone who cannot see it. A few words.'
            }

      - name: steps
        label: What happens when you get in touch
        file: src/content/home/steps.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Line under the heading, widget: text }
          - name: items
            label: Steps
            widget: list
            summary: '{{fields.title}}'
            hint: 'Numbered in this order. Drag to reorder.'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }

      - name: services
        label: How I can help
        file: src/content/home/services.json
        hint: 'The services themselves are under Services.'
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'Its name in the top menu. Keep it short. Empty uses “How I can help”.'
            }
          - { name: intro, label: Line under the heading, widget: text }

      - name: about
        label: About me
        file: src/content/home/about.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'Its name in the top menu. Keep it short. Empty uses “About me”.'
            }
          - {
              name: body,
              label: Body,
              widget: markdown,
              buttons: [bold, italic, link, bulleted-list],
              editor_components: [],
              modes: [rich_text]
            }
          - {
              name: photoAlt,
              label: Photo description,
              widget: string,
              hint: 'For anyone who cannot see it. A few words.'
            }

      - name: fees
        label: Fees
        file: src/content/home/fees.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'Its name in the top menu. Keep it short. Empty uses “Fees”.'
            }
          - { name: intro, label: Line under the heading, widget: text }
          - name: rows
            label: Fee groups
            widget: list
            summary: '{{fields.title}}'
            hint: 'Search engines read the price range from these.'
            fields:
              - { name: title, label: Group, widget: string }
              - name: lines
                label: Lines
                widget: list
                summary: '{{fields.label}} — {{fields.value}}'
                fields:
                  - {
                      name: label,
                      label: What it is,
                      widget: string,
                      hint: 'e.g. In person, 50 minutes'
                    }
                  - { name: value, label: Fee, widget: string, hint: 'e.g. £70–90' }
          - name: note
            label: Low-income note
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - {
                  name: body,
                  label: Body,
                  widget: markdown,
                  buttons: [bold, italic, link],
                  editor_components: [],
                  modes: [rich_text],
                  hint: 'Use {mailto} for your email link.'
                }

      - name: quals
        label: Qualifications and membership
        file: src/content/home/quals.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - name: items
            label: Qualifications
            widget: list
            summary: '{{fields.title}} ({{fields.detail}})'
            fields:
              - { name: title, label: Qualification, widget: string }
              - {
                  name: detail,
                  label: Year,
                  widget: string,
                  hint: 'The year, or “studying”.'
                }
          - name: bodies
            label: Membership and registration
            widget: object
            hint: 'The bodies are under General → Membership and registration.'
            fields:
              - { name: title, label: Heading, widget: string }

      - name: faq
        label: Questions people ask
        file: src/content/home/faq.json
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'Its name in the top menu. Keep it short. Empty uses “Questions”.'
            }
          - name: items
            label: Questions
            widget: list
            summary: '{{fields.q}}'
            fields:
              - { name: q, label: Question, widget: string }
              - {
                  name: a,
                  label: Answer,
                  widget: markdown,
                  buttons: [bold, italic, link, bulleted-list],
                  editor_components: [],
                  modes: [rich_text]
                }

      - name: contact
        label: Get in touch
        file: src/content/home/contact.json
        hint: 'Also the heading over the contact block in the phone menu.'
        fields:
          - { name: kicker, label: Small label above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - {
              name: navLabel,
              label: Menu wording,
              widget: string,
              required: false,
              pattern: ['^.{1,18}$', 'Menu wording has to be 18 characters or fewer — the menu bar is only so wide.'],
              hint: 'Its name in the top menu. Keep it short. Empty uses “Get in touch”.'
            }
          - { name: intro, label: Line under the heading, widget: text }

  - name: services
    label: Services
    label_singular: Service
    folder: src/content/services
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [order, title]
    editor: { preview: false }
    description: 'One entry per thing you offer. Add a page of its own if you want one.'
    fields:
      - {
          name: order,
          label: Order on the page,
          widget: number,
          value_type: int,
          default: 100,
          hint: 'Lower first. Tens, so you can slide one between two.'
        }
      # Not an editable field, on purpose: this is what the page's
      # address is built from. It is declared so the editor keeps
      # it on save rather than deleting it, which is exactly the
      # failure scripts/check-cms.ts exists to catch.
      - { name: slug, widget: hidden }
      - { name: title, label: Title, widget: string }
      - { name: who, label: Who it is for, widget: string }
      - {
          name: body,
          label: Body,
          widget: markdown,
          buttons: [bold, italic, link],
          editor_components: [],
          modes: [rich_text],
          hint: 'Shown on the front page, and again at the top of its own page.'
        }
      - name: detail
        label: The longer version
        widget: object
        required: false
        collapsed: true
        hint: 'Leave empty for no page of its own.'
        fields:
          - {
              name: body,
              label: Body,
              widget: markdown,
              # Headings start at two. One is the page's own title,
              # which the site writes from the service name — a
              # second first-level heading inside the body would
              # give the page two titles and tell a search engine
              # the wrong one is the subject.
              buttons:
                [
                  bold,
                  italic,
                  link,
                  heading-two,
                  heading-three,
                  bulleted-list,
                  numbered-list,
                  quote
                ],
              editor_components: [],
              modes: [rich_text],
              required: false,
              hint: 'Use Heading 2 for the main parts, Heading 3 under them.'
            }
          - name: seo
            label: Search engine summary
            widget: object
            required: false
            collapsed: true
            hint: 'Leave empty to use the page’s own title and opening lines.'
            fields:
              - {
                  name: title,
                  label: Title in the search result,
                  widget: string,
                  required: false,
                  hint: 'Also the browser tab. About 60 characters.'
                }
              - {
                  name: description,
                  label: Description in search results,
                  widget: text,
                  required: false,
                  hint: 'About 150 characters.'
                }

  - name: general
    label: General
    editor: { preview: false }
    files:
      - name: contact
        label: Contact details
        file: src/content/contact.json
        hint: 'Your number and address. Everything that links to you is built from these.'
        fields:
          - {
              name: phone,
              label: Phone,
              widget: string,
              hint: 'However you would say it. The Call and WhatsApp links come from this.'
            }
          - {
              name: phoneNote,
              label: Note under the phone number,
              widget: string,
              hint: 'What they can do — not how fast you reply.'
            }
          - {
              name: whatsappNote,
              label: Note under WhatsApp,
              widget: string,
              hint: 'Same number as the phone row.'
            }
          - { name: email, label: Email, widget: string }
          - { name: emailNote, label: Note under the email address, widget: string }
          - {
              name: location,
              label: Where you work,
              widget: string
            }
          - { name: locationNote, label: Note under where you work, widget: string }

      - name: testimonials
        label: Testimonials
        file: src/content/testimonials.json
        hint: 'Shown as a carousel. Leave it empty and the section does not appear.'
        fields:
          - {
              name: kicker,
              label: Small label above the quotes,
              widget: string
            }
          - name: items
            label: Testimonials
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: quote, label: Quote, widget: text }
              - {
                  name: name,
                  label: Who said it,
                  widget: string,
                  hint: 'Anonymised, e.g. “Supervisee, 2025”.'
                }
              - {
                  name: detail,
                  label: Role or context,
                  widget: string,
                  required: false
                }

      - name: social
        label: Social profiles
        file: src/content/social.json
        hint: 'Shown as logos in the footer.'
        fields:
          - {
              name: note,
              label: Note to yourself,
              widget: text,
              required: false,
              hint: 'Not shown on the site. How each profile was confirmed.'
            }
          - name: profiles
            label: Profiles
            widget: list
            summary: '{{fields.label}}'
            fields:
              # Kept in step with src/lib/generated/social-icons.ts by
              # scripts/check-social.ts: a platform offered here with no entry
              # there would put an icon in the footer that cannot be drawn.
              - {
                  name: platform,
                  label: Platform,
                  widget: select,
                  options:
                    [
                      { label: Facebook, value: facebook },
                      { label: Instagram, value: instagram },
                      { label: LinkedIn, value: linkedin },
                      { label: X, value: x },
                      { label: Threads, value: threads },
                      { label: Bluesky, value: bluesky },
                      { label: YouTube, value: youtube },
                      { label: TikTok, value: tiktok },
                      { label: Substack, value: substack },
                      { label: Spotify, value: spotify },
                      { label: Mastodon, value: mastodon },
                      { label: Pinterest, value: pinterest }
                    ],
                  hint: 'Decides which logo the footer draws.'
                }
              - {
                  name: label,
                  label: Name,
                  widget: string,
                  required: false,
                  hint: 'Leave empty to use the platform’s name.'
                }
              - {
                  name: url,
                  label: Address,
                  widget: string,
                  hint: 'Pasted from the browser.'
                }

      # The bodies, out of Site and standing on their own. They were a list
      # nested at the bottom of the Site entry, under a name, a tagline and
      # four fields of Schema.org — so adding a register meant opening the
      # entry John has least reason to open and scrolling past everything in
      # it. They are also the only thing in that entry with a logo to upload.
      - name: memberships
        label: Membership and registration
        file: src/content/memberships.json
        hint: 'The bodies you belong to, and the ones that list you.'
        fields:
          - name: items
            label: Bodies
            widget: list
            summary: '{{fields.abbr}}'
            fields:
              - { name: name, label: Full name, widget: string }
              - { name: abbr, label: Abbreviation, widget: string }
              - {
                  name: logo,
                  label: Logo,
                  widget: image,
                  media_folder: '/static/img/logos',
                  public_folder: '/img/logos',
                  hint: 'Shown on a white plate. Any size.'
                }
              - {
                  name: isMembership,
                  label: You are a member of this body,
                  widget: boolean,
                  default: true,
                  hint: 'Off for a body that accredits rather than admits you.'
                }
              - {
                  name: note,
                  label: Note beside the name,
                  widget: string,
                  required: false,
                  hint: 'Your grade, e.g. Accredited Member. Leave empty for none.'
                }
              - {
                  name: href,
                  label: Register listing,
                  widget: string,
                  required: false,
                  hint: 'Your listing on their register. Leave empty for no link.'
                }

      - name: site
        label: Site
        file: src/content/site.json
        hint: 'Your name and the line under it.'
        fields:
          - { name: name, label: Name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - {
              name: footerNote,
              label: Footer note,
              widget: string,
              hint: 'Use {year} for the year.'
            }
          - name: schema
            label: What search engines are told
            widget: object
            hint: 'For search engines. Never shown on the page.'
            fields:
              - { name: jobTitle, label: Job title, widget: string }
              - {
                  name: bio,
                  label: A sentence or two about you,
                  widget: text,
                  hint: 'For search engines. Your About me is under Home.'
                }
              - {
                  name: knowsAbout,
                  label: Topics you work with,
                  widget: list,
                  field: { name: topic, label: Topic, widget: string }
                }
              - {
                  name: areaServed,
                  label: Areas served,
                  widget: list,
                  field: { name: area, label: Area, widget: string }
                }

      # How the site LOOKS somewhere else: in a search result, and in the
      # picture that appears when somebody pastes the address into a chat.
      # The two were in different places — the sentence Google shows was at
      # the bottom of Site, the share card was at the bottom of the home
      # page — and they are one job, done once, so they are one entry.
      - name: search
        label: Search engines and sharing
        file: src/content/search.json
        hint: 'How your site looks in a Google result and when someone shares it.'
        fields:
          # Read straight from the file by scripts/gen-og.ts as the share
          # card's last fallback title, so a placeholder must never appear
          # here (check-contact.ts).
          - {
              name: title,
              label: Title in the search result,
              widget: string,
              hint: 'Also the browser tab. About 60 characters.'
            }
          - {
              name: description,
              label: Description in search results,
              widget: text,
              hint: 'About 150 characters. Also used on the Blog page.'
            }
          - name: og
            label: Social-share card
            widget: object
            hint: 'Redrawn on every publish. Your name and location are added for you.'
            fields:
              # The card is drawn by scripts/gen-og.ts, in plain node,
              # straight from the JSON — so it never sees the {phone}-style
              # placeholders the pages resolve. A token here would be painted
              # onto the image as literal braces, and check-contact.ts refuses
              # one in this field and in the two others that script reads.
              - {
                  name: title,
                  label: Headline on the card,
                  widget: string,
                  hint: 'Leave empty to use your home page headline.'
                }

      # The site's own words rather than John's prose. Last in General because
      # it is the entry he is least likely to open — but it exists, because
      # until it did these were the only words on the page he could not change:
      # he could rewrite every heading and every paragraph, and not rename the
      # row above his own phone number.
      #
      # The assistive-technology labelling is deliberately NOT here. See
      # scripts/check-copy.ts, which holds that list and a reason for each.
      - name: labels
        label: Wording on buttons and labels
        file: src/content/labels.json
        hint: 'The small words the site puts around your writing.'
        fields:
          - {
              name: note,
              label: What this page is,
              widget: hidden
            }
          - name: contactRows
            label: Labels in the contact section
            widget: object
            fields:
              - { name: phone, label: Above the phone number, widget: string }
              - { name: email, label: Above the email address, widget: string }
              - {
                  name: whatsapp,
                  label: Above the WhatsApp row,
                  widget: string,
                  hint: 'Also the WhatsApp link in the phone menu.'
                }
              - {
                  name: location,
                  label: Above where you work,
                  widget: string
                }
          - name: header
            label: The bar at the top
            widget: object
            fields:
              - {
                  name: call,
                  label: Short label on the Call button,
                  widget: string,
                  hint: 'Shown when the bar is too narrow for the number.'
                }
          - name: blog
            label: Moving between posts
            widget: object
            fields:
              - { name: older, label: Link to the previous post, widget: string }
              - { name: newer, label: Link to the next post, widget: string }
          - name: notFound
            label: When a page cannot be found
            widget: object
            hint: 'What someone reads at an address that is not here.'
            fields:
              - { name: heading, label: Heading, widget: string }
              - {
                  name: errorHeading,
                  label: Heading when something else goes wrong,
                  widget: string
                }
              - { name: body, label: The sentence under it, widget: text }

  # A blog is a FOLDER collection: one file per post in `src/content/posts/`,
  # one entry per post in the sidebar, a New post button, a search across the
  # posts, and a save that writes the one post John edited rather than
  # rewriting every post he has ever published.
  #
  # It was a `files:` entry holding a list of sortable cards inside a single
  # `posts.json`, and that was the shape of the CHECK rather than the shape of
  # the content: scripts/check-cms.ts could only diff a `files:` entry against
  # a JSON file and reported every other collection shape as a fault, so the
  # content was bent to fit the gate. The gate has been taught folder
  # collections instead.
  #
  # JSON rather than frontmatter markdown, on purpose. Every other content
  # file here is JSON, the body is already a markdown STRING rendered by
  # `marked` through $lib/markdown, and a second content format would fork the
  # pipeline — a second parser, a second set of checks — for nothing gained.
  - name: blog
    label: Blog
    label_singular: Post
    editor: { preview: false }
    folder: src/content/posts
    create: true
    extension: json
    format: json
    # The filename, and so the post's address. Sveltia settles it when the post
    # is created and leaves it alone afterwards, so retitling a post that is
    # already out in the world cannot break a link somebody has shared.
    slug: '{{title}}'
    summary: '{{title}} — {{status}}'
    sortable_fields: [publishAt, title]
    description: 'No posts means no blog: the link and the page appear with your first one.'
    fields:
      # Not an editable field, on purpose: this is what the post's address is
      # built from. Optional because a post made in the editor arrives without
      # one, and the address is then made from the title — which is also what
      # the filename is made from, so the two agree without either being typed.
      - { name: slug, widget: hidden, required: false }
      - { name: title, label: Title, widget: string }
      - {
          name: status,
          label: Status,
          widget: select,
          default: draft,
          options:
            [
              { label: 'Draft — only you can see it', value: draft },
              { label: 'Published', value: published }
            ],
          hint: 'A draft is not built into the site at all.'
        }
      - {
          name: publishAt,
          label: Publish on,
          widget: datetime,
          default: '{{now}}',
          hint: 'A time in the future publishes it then, on its own.'
        }
      - {
          name: excerpt,
          label: Summary,
          widget: text,
          hint: 'Two or three lines. Shown in the list of posts.'
        }
      - {
          name: image,
          label: Picture,
          widget: image,
          required: false,
          media_folder: '/static/img/blog',
          public_folder: '/img/blog',
          hint: 'Shown on the Blog page and on the post. Not on the front page.'
        }
      - {
          name: imageAlt,
          label: Picture description,
          widget: string,
          required: false,
          hint: 'For anyone who cannot see it. Empty if it is decoration.'
        }
      - {
          name: body,
          label: Body,
          widget: markdown,
          # Same rule as a service's own page: headings start at two, because
          # the post's title is the page's only first-level one.
          buttons:
            [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote],
          editor_components: [],
          modes: [rich_text],
          hint: 'Use Heading 2 for the parts, Heading 3 under them.'
        }
      - name: seo
        label: Search engine summary
        widget: object
        required: false
        collapsed: true
        hint: 'Leave empty to use the post’s own title and summary.'
        fields:
          - {
              name: title,
              label: Title in the search result,
              widget: string,
              required: false,
              hint: 'Also the browser tab. About 60 characters.'
            }
          - {
              name: description,
              label: Description in search results,
              widget: text,
              required: false,
              hint: 'About 150 characters.'
            }
